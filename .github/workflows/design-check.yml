name: Design check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install needed: the check is plain Node.
      - run: node scripts/design-check.mjs
